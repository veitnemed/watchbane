name: Watchbane Windows bundle smoke

on:
  push:
    branches: ["feature/story-search"]
    paths:
      - ".github/workflows/windows-story-smoke.yml"
      - "watchbane.spec"
      - "start_app.py"
      - "pytest.ini"
      - "dataset/**"
      - "diagnostics/**"
      - "posters/**"
      - "tools/build_desktop.ps1"
      - "tools/qa/audit_windows_distribution.py"
      - "tools/smoke_windows_bundle.ps1"
      - "requirements*.txt"
      - "app/**"
      - "apis/**"
      - "candidates/**"
      - "common/**"
      - "config/**"
      - "desktop/**"
      - "storage/**"
      - "tests/desktop/test_story*.py"
      - "tests/test_packaging_contract.py"
      - "tests/test_sqlite_watched_repository.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watchbane-story-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Windows smoke (${{ matrix.profile }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [lexical, semantic]
    env:
      QT_QPA_PLATFORM: offscreen
      WATCHBANE_BUNDLE_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install test and build dependencies
        run: python -m pip install -r requirements.txt "pytest>=8,<9" "pytest-qt>=4.4,<5" "PyInstaller>=6.13,<7"
      - name: Install semantic runtime libraries only
        if: matrix.profile == 'semantic'
        run: python -m pip install -r requirements-story.txt
      - name: Test packaging and search-first UI
        run: >-
          python -m pytest -q
          tests/test_packaging_contract.py
          tests/test_sqlite_watched_repository.py
          tests/desktop/test_story_flow.py
          tests/desktop/test_story_catalog_flow.py
          tests/desktop/test_story_quiet_ui.py
          tests/desktop/test_story_snapshot_picker.py
          tests/desktop/test_story_model_preference.py
      - name: Build a disposable Windows bundle
        run: ./tools/build_desktop.ps1
      - name: Observe native prerequisites in the semantic QA build
        if: matrix.profile == 'semantic'
        shell: pwsh
        run: python -c "import sys; from tools.qa.audit_windows_distribution import main; raise SystemExit(0 if main(sys.argv[1:]) in (0, 1) else 2)" --summary --profile semantic --bundle dist/Watchbane
      - name: Check the runtime and start the executable without Python on PATH
        run: ./tools/smoke_windows_bundle.ps1 -BundleDirectory dist/Watchbane -BundleProfile $env:WATCHBANE_BUNDLE_PROFILE
      # No upload: this is test infrastructure, not a release or catalog distribution.
