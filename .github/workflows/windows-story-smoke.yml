name: Watchbane Windows bundle smoke

on:
  push:
    branches: ["feature/story-search"]
    paths:
      - ".github/workflows/windows-story-smoke.yml"
      - "watchbane.spec"
      - "start_app.py"
      - "pytest.ini"
      - "dataset/**"
      - "diagnostics/**"
      - "posters/**"
      - "tools/build_desktop.ps1"
      - "tools/qa/audit_windows_distribution.py"
      - "tools/qa/build_story_starter_catalog.py"
      - "tools/smoke_windows_bundle.ps1"
      - "requirements*.txt"
      - "app/**"
      - "apis/**"
      - "candidates/**"
      - "common/**"
      - "config/**"
      - "desktop/**"
      - "storage/**"
      - "tests/desktop/test_story*.py"
      - "tests/test_packaging_contract.py"
      - "tests/test_candidate_action_identity.py"
      - "tests/desktop/test_collection_action_identity.py"
      - "tests/test_sqlite_watched_repository.py"
      - "tests/test_sqlite_backup_restore.py"
      - "tests/test_sqlite_export_legacy.py"
      - "tests/test_sqlite_import_legacy.py"
      - "tests/test_legacy_import_atomicity.py"
      - "tests/test_portable_collection_export.py"
      - "tests/test_sqlite_startup_recovery.py"
      - "tests/test_sqlite_upgrade_profiles.py"
      - "tests/test_sqlite_v5_failure_boundary.py"
      - "tests/test_title_state_service.py"
      - "tests/test_stale_saved*.py"
      - "tests/test_story_model_install.py"
      - "tests/test_story_online_client.py"
      - "tests/test_story_narrative_negation.py"
      - "tests/test_story_seed_snapshot.py"
      - "tests/test_tmdb_detached_transport.py"
      - "tests/test_story_starter_catalog.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watchbane-story-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Windows smoke (${{ matrix.profile }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [lexical, semantic]
    env:
      QT_QPA_PLATFORM: offscreen
      WATCHBANE_BUNDLE_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install test and build dependencies
        run: python -m pip install -r requirements.txt "pytest>=8,<9" "pytest-qt>=4.4,<5" "PyInstaller>=6.13,<7"
      - name: Install semantic runtime libraries only
        if: matrix.profile == 'semantic'
        run: python -m pip install -r requirements-story.txt
      - name: Test packaging and search-first UI
        id: story_pytest
        run: >-
          python -m pytest -q --tb=short --junitxml=story-test-result.xml
          tests/test_packaging_contract.py
          tests/test_candidate_action_identity.py
          tests/desktop/test_collection_action_identity.py
          tests/test_sqlite_watched_repository.py
          tests/test_sqlite_backup_restore.py
          tests/test_sqlite_export_legacy.py
          tests/test_sqlite_import_legacy.py
          tests/test_legacy_import_atomicity.py
          tests/test_portable_collection_export.py
          tests/test_sqlite_startup_recovery.py
          tests/test_sqlite_upgrade_profiles.py
          tests/test_sqlite_v5_failure_boundary.py
          tests/test_title_state_service.py
          tests/test_stale_saved_removal_identity.py
          tests/test_stale_saved_write_conflict.py
          tests/test_story_model_install.py
          tests/test_story_narrative_negation.py
          tests/test_story_seed_snapshot.py
          tests/test_tmdb_detached_transport.py
          tests/test_story_starter_catalog.py
          tests/desktop/test_story_flow.py
          tests/desktop/test_story_no_match.py
          tests/desktop/test_story_catalog_flow.py
          tests/desktop/test_story_quiet_ui.py
          tests/desktop/test_story_snapshot_picker.py
          tests/desktop/test_story_model_preference.py
          tests/desktop/test_story_model_install_ui.py
          tests/test_story_online_client.py
          tests/desktop/test_story_online_mode.py
          tests/desktop/test_story_online_outcome.py
      - name: Isolate failed pytest group (SQLite upgrades)
        if: ${{ failure() && steps.story_pytest.outcome == 'failure' }}
        run: python -m pytest -q tests/test_sqlite_upgrade_profiles.py
      - name: Isolate failed pytest group (SQLite migration rollback)
        if: ${{ failure() && steps.story_pytest.outcome == 'failure' }}
        run: python -m pytest -q tests/test_sqlite_v5_failure_boundary.py
      - name: Isolate failed pytest group (E5 options and empty-state UI)
        if: ${{ failure() && steps.story_pytest.outcome == 'failure' }}
        run: python -m pytest -q tests/desktop/test_story_no_match.py
      - name: Isolate failed pytest group (detached TMDb transport)
        if: ${{ failure() && steps.story_pytest.outcome == 'failure' }}
        run: python -m pytest -q tests/test_tmdb_detached_transport.py
      - name: Read combined pytest case names
        id: combined_details
        if: ${{ failure() && steps.story_pytest.outcome == 'failure' }}
        shell: pwsh
        run: |
          @'
          import os, re, xml.etree.ElementTree as ET
          from pathlib import Path
          names = []
          p = Path("story-test-result.xml")
          if p.is_file():
              for case in ET.parse(p).iter("testcase"):
                  problem = case.find("failure")
                  if problem is None:
                      problem = case.find("error")
                  if problem is not None:
                      node = re.sub(r"[^A-Za-z0-9_.-]", "_", case.get("name", ""))[:90]
                      lines = re.findall(r"test_[A-Za-z0-9_]+[.]py:(\d+)", problem.text or "")
                      names.append(node + (":" + lines[-1] if lines else ""))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("nodes=" + (",".join(names[:3]) or "unknown") + "\n")
          '@ | python -
      - name: Combined failing cases (${{ steps.combined_details.outputs.nodes }})
        if: ${{ failure() && steps.combined_details.outcome == 'success' }}
        run: Write-Output "See the combined pytest step."
      - name: Build a disposable Windows bundle
        run: ./tools/build_desktop.ps1
      - name: Observe native prerequisites in the semantic QA build
        if: matrix.profile == 'semantic'
        shell: pwsh
        run: python -c "import sys; from tools.qa.audit_windows_distribution import main; raise SystemExit(0 if main(sys.argv[1:]) in (0, 1) else 2)" --summary --profile semantic --bundle dist/Watchbane
      - name: Check the runtime and start the executable without Python on PATH
        run: ./tools/smoke_windows_bundle.ps1 -BundleDirectory dist/Watchbane -BundleProfile $env:WATCHBANE_BUNDLE_PROFILE
      # No upload: this is test infrastructure, not a release or catalog distribution.
