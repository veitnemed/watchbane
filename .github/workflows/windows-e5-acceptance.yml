name: Watchbane Windows full E5 check

# Intentionally not on ordinary source changes: this QA downloads ~487 MB once.
on:
  push:
    branches: ["feature/story-search"]
    paths:
      - ".github/workflows/windows-e5-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watchbane-windows-e5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e5:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      WATCHBANE_BUNDLE_PROFILE: semantic
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build dependencies and pinned inference runtime
        run: python -m pip install -r requirements-preview.txt "PyInstaller>=6.13,<7"
      - name: Build disposable semantic executable
        run: ./tools/build_desktop.ps1
      - name: Fetch and verify public FP32 E5 in the disposable runner
        run: python -m tools.qa.download_story_model --destination "$env:RUNNER_TEMP/watchbane-e5" --variant fp32 --accept-download
      - name: Verify actual E5 inference inside the frozen executable without Python on PATH
        run: ./tools/smoke_windows_e5.ps1 -BundleDirectory dist/Watchbane -ModelDirectory "$env:RUNNER_TEMP/watchbane-e5"
      # No artifact upload, no TMDb, no data pack, no model redistribution.
